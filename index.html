*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:88px;-webkit-font-smoothing:antialiased}

header{padding-top:14px}
main{padding-bottom:16px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand svg{width:24px;height:24px;color:var(--ac)}
.brand span{color:var(--ac)}
.seg{display:flex;background:var(--acs);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;min-width:0;border:0;background:none;color:var(--mut);font:inherit;font-weight:500;padding:9px 10px;border-radius:9px;min-height:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(14,22,39,.14)}
.seg button.add{flex:0 0 auto;color:var(--ac);font-weight:600;padding:9px 14px}
h2{font-size:15px;font-weight:600;margin:22px 0 8px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.num{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;font-weight:700}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.note{background:var(--acs);border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
.dn{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:600}
.ib{border:1px solid var(--bd);background:var(--card);color:var(--tx);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:inherit;font-size:20px;padding:0}
.ib:disabled{opacity:.35}.ib.pri{background:var(--ac);border-color:var(--ac);color:var(--on)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{background:var(--hero);color:#fff;border:0;padding:20px 16px}
.hero .mut{color:#b9c6ea}
.ring{position:relative;width:208px;max-width:70%;margin:0 auto 16px}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:62px;line-height:1}
.big.over{color:#ffb26b}
.eq{display:flex;align-items:flex-start;justify-content:space-between;margin:14px 0 4px;text-align:center}.eq>div{flex:1;display:flex;flex-direction:column}.eq b{font-size:20px;font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;line-height:1.1}.eq span{font-size:11px}.eq i{font-style:normal;color:#b9c6ea;padding-top:1px;font-size:18px}.eq .off{opacity:.45;text-decoration:line-through}.tl{display:block;margin:2px auto 14px;background:none;border:0;color:#b9c6ea;font:inherit;font-size:12px;text-decoration:underline;padding:6px;cursor:pointer}
.macs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.macs b{font-weight:600;font-size:15px;display:block}
.mb{height:4px;background:rgba(255,255,255,.18);border-radius:9px;margin:6px 0 4px;overflow:hidden}
.mb i{display:block;height:100%;border-radius:9px}

.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.bar.t{position:relative;margin:0}
.bar.t::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--mut)}

.more{margin-top:2px}

.ex{grid-template-columns:116px 1fr;gap:6px 12px;align-items:start}

.fr .mut{white-space:nowrap}
.chp{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;min-width:40px;padding:0 6px;min-height:44px;font:inherit;font-weight:600}
.chp.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
#chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.fp{margin-top:12px;border-top:1px solid var(--bd);padding-top:12px}
