function wkSplit(id,from,to){const dir={},ind={};(S.wk[id]||[]).forEach(x=>{const a=daysSince(x.d);if(a<from||a>=to)return;(x.ex||[]).forEach((nm,i)=>{const e=EX[nm];if(!e)return;const n=(x.st&&x.st[i])||3;e.p.forEach(m=>dir[m]=(dir[m]||0)+n);e.s.forEach(m=>ind[m]=(ind[m]||0)+n)})});return{dir,ind}}
function muscCard(id){if(!isPrem())return lockCard("Músculos: semana a semana","Compare o volume de cada músculo com a semana anterior, veja séries diretas e de apoio e receba orientações de equilíbrio do treino.");

 +MAIN.map(m=>{const d=A.dir[m]||0,i=A.ind[m]||0,e=eff(A,m),pe=eff(B,m),dl=Math.round((e-pe)*10)/10,[lb,cl]=st(e);return `<div class="mr" style="align-items:center"><span>${m}</span><div class="bar t" style="position:relative"><i style="width:${Math.min(100,d/mx*100)}%"></i><i style="position:absolute;left:${Math.min(100,d/mx*100)}%;top:0;height:100%;width:${Math.min(100-Math.min(100,d/mx*100),i*.5/mx*100)}%;background:var(--ac);opacity:.35;border-radius:0 6px 6px 0"></i></div><span class="mut" style="text-align:right;min-width:0;font-size:13px;line-height:1.3"><b style="color:${cl}">${lb}</b><br>${d}${i?" + "+i+" apoio":" séries"}<br>${dl>0?"+"+dl:dl<0?"−"+Math.abs(dl):"igual"} vs anterior</span></div>`}).join("");
 const E=m=>eff(A,m),push=E("Peitoral")+E("Ombros")+E("Tríceps"),pull=E("Costas")+E("Bíceps"),quad=E("Quadríceps"),post=E("Posterior de coxa")+E("Glúteos"),T=[];
 if(push+pull>=12){if(push>pull*1.5)T.push("Você treinou bem mais empurrar (peito, ombros, tríceps) do que puxar (costas, bíceps). Inclua mais remadas e puxadas pra equilibrar os ombros.");else if(pull>push*1.5)T.push("Você treinou bem mais puxar do que empurrar. Inclua mais supinos ou flexões pra equilibrar.")}
 if(quad+post>=8){if(quad>post*1.8)T.push("A frente da coxa recebeu bem mais estímulo que a parte de trás. Inclua stiff, mesa flexora ou elevação pélvica.");else if(post>quad*1.8)T.push("A parte de trás da perna recebeu mais estímulo que a frente. Inclua agachamento ou leg press.")}
 const low=MAIN.filter(m=>eff(A,m)<6);if(low.length&&low.length<=5)T.push("Pouco estímulo esta semana: "+low.join(", ").replace(/, ([^,]*)$/," e $1")+". Se for de propósito, tudo bem; senão, ajuste a rotina.");

function vProg(){

 if(p.goal&&p.goal>0){const ks=Object.keys(W).sort(),st=ks.length?W[ks[0]]:p.w,cur=ks.length?W[ks[ks.length-1]]:p.w,tot=Math.abs(st-p.goal),done=Math.abs(st-cur),dir=p.goal<st?cur<=st:cur>=st,pc=tot>0&&dir?Math.max(0,Math.min(100,R(done/tot*100))):0,left=Math.abs(cur-p.goal),wk=Math.abs(c.tdee-c.t)*7/7700,okd=(p.goal<cur&&c.t<c.tdee)||(p.goal>cur&&c.t>c.tdee);h+=`<h2>Meta de peso</h2><div class="card"><div class="row sp"><span><b>${cur} kg</b> <span class="mut">agora</span></span><span><b>${p.goal} kg</b> <span class="mut">meta</span></span></div><div class="bar" style="margin:10px 0"><i style="width:${pc}%"></i></div><div class="mut">${left<=0.1?"Meta atingida.":`Faltam ${r1(left)} kg. ${okd&&wk>0?`No ritmo planejado (cerca de ${r1(wk)} kg por semana), isso leva uns ${Math.ceil(left/wk)} semanas.`:""}`}</div></div>`}
 const bn=days.map(d=>burnDay(id,d,p)),sb=S.burnOn!==false,tb=bn.reduce((x,y)=>x+y,0),ab=R(tb/7);

 ["Whey protein","0 a 2 doses/dia","1 dose de 30 g ≈ 24 g de proteína. Use só se não bater a meta de proteína com a comida."],
