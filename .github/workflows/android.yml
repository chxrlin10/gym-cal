name: Android
on:
  workflow_dispatch:
  push:
    paths: ["index.html", "capacitor.config.json", "package.json", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Montar o app
        run: |
          mkdir -p www && cp index.html privacidade.html excluir-conta.html www/
          base64 -d assets/icon.b64 > assets/icon-only.png
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#0e1b3d" --iconBackgroundColorDark "#0e1b3d"
          npx cap sync android
      - name: Permissao da camera (leitor de codigo de barras)
        run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: APK de teste
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: gym-cal-apk-teste, path: android/app/build/outputs/apk/debug/app-debug.apk }
