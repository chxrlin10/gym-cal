<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar senha — Gym.cal</title><style>body{font:16px/1.6 system-ui;max-width:480px;margin:40px auto;padding:20px;background:#f5f5f0;color:#202d29}input,button{box-sizing:border-box;width:100%;padding:14px;font:inherit;margin:8px 0}button{background:#245844;color:white;border:0;border-radius:10px}</style></head><body><h1>Nova senha do Gym.cal</h1><p>Esta página altera somente sua senha. Depois, volte ao app e entre na conta.</p><form id="form"><label for="pw">Nova senha (mínimo 8 caracteres)</label><input id="pw" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Repita a senha</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button id="save" disabled>Salvar nova senha</button></form><p id="status" role="status">Verificando o link…</p><a href="index.html">Voltar ao Gym.cal</a><script>
const base='https://ypudxlvlssvulbfuwdxu.supabase.co',key='sb_publishable_8lwXX3J2acaOGPWx6Cz9Cg_pgCBWs24';
const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);let token=hash.get('access_token')||'',busy=false;
history.replaceState(null,'',location.pathname);const status=document.getElementById('status'),button=document.getElementById('save');
async function call(path,method,body,auth){return fetch(base+'/auth/v1/'+path,{method,headers:{apikey:key,'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+auth}:{})},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(12000)})}
(async()=>{try{if(query.get('token_hash')&&query.get('type')==='recovery'){const r=await call('verify','POST',{token_hash:query.get('token_hash'),type:'recovery'});if(!r.ok)throw 0;token=(await r.json()).access_token}if(!token)throw 0;const r=await call('user','GET',null,token);if(!r.ok)throw 0;button.disabled=false;status.textContent='Digite sua nova senha.'}catch(e){token='';status.textContent='Link inválido ou expirado. Peça outro em Perfil → Esqueci minha senha.'}})();
document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(busy||!token)return;const password=document.getElementById('pw').value;if(password.length<8||password!==document.getElementById('confirm').value){status.textContent='As senhas precisam ser iguais e ter pelo menos 8 caracteres.';return}busy=true;button.disabled=true;try{const r=await call('user','PUT',{password},token);if(!r.ok)throw 0;await call('logout?scope=global','POST',null,token).catch(()=>{});token='';document.getElementById('form').reset();status.textContent='Senha alterada. Volte ao app e entre com a nova senha.'}catch(e){status.textContent='Não consegui alterar. Verifique a conexão ou solicite um novo link.';button.disabled=false}finally{busy=false}};
</script></body></html>
